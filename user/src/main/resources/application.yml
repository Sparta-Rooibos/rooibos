spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5438/user_db
    username: root
    password: "1234"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: localhost
      port: 6381

server:
  port: 19093

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:19090/eureka/

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 0.1